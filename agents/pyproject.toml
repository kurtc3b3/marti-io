[project]
name = "agents"
version = "0.1.0"
description = "Multi-agent daily assistant API with LangGraph"
readme = "README.md"
authors = [
    { name = "mekanizeai", email = "mekanizeai@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.138.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.6",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-swarm>=0.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.9",
    "redis[hiredis]>=5.2.1",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
agents = "agents:main"
daily-api = "agents.main:run"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agents"
module-root = "src"
